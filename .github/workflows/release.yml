name: Release WordPress plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"

      - name: Validate PHP syntax
        shell: bash
        run: find . -path './.git' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -Fq "Version: ${VERSION}" typlive-scoreboards.php
          grep -Fq "TYPLIVE_SCOREBOARDS_VERSION', '${VERSION}'" typlive-scoreboards.php

      - name: Build installable ZIP
        shell: bash
        run: |
          mkdir -p build/typlive-scoreboards
          cp typlive-scoreboards.php readme.txt build/typlive-scoreboards/
          cp -R assets includes templates build/typlive-scoreboards/
          cd build
          zip -r ../typlive-scoreboards.zip typlive-scoreboards

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: typlive-scoreboards.zip
